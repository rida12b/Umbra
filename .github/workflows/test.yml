name: Tests (v0.7 legacy)

# Legacy v0.7 checks, failing on main since the first commit (lint debt in umbra/).
# Scoped to the legacy code so that new work is not blocked by it; removed with v0.7 (SPEC: Code layout).
on:
  push:
    branches: [main]
    paths: ["umbra/**", "tests/**", "pyproject.toml", "poetry.lock"]
  pull_request:
    branches: [main]
    paths: ["umbra/**", "tests/**", "pyproject.toml", "poetry.lock"]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: poetry install
      
      - name: Run tests
        run: poetry run pytest tests/ -v
      
      - name: Run linter
        run: poetry run ruff check umbra/

