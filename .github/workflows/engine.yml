name: Engine

on:
  pull_request:
    paths: ["engine/**", "ui/**", "plugin/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["engine/**", "ui/**", "plugin/**", ".github/workflows/engine.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: pyright src tests

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test # pure map geometry, on real engine output (Node strips the types)
      - run: npm run build # type-check, then build into the engine package
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e "./engine"
      - run: npm ci
        working-directory: ui
      - run: npm run build # the engine serves the built app
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test --reporter=line # the real engine on a fixture Project, Claude Code replaced by fakes that fail
        working-directory: ui
