<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbra — Ligne de métro</title>
<style>
:root{
  --bg:#0d1117; --bg2:#151b23; --bg3:#1d2530; --line:#2f3844; --line2:#404b59;
  --text:#e8eef5; --muted:#a3b0bf; --faint:#75818f;
  --green:#4ade80; --blue:#60a5fa; --amber:#fbbf24; --red:#f87171; --redd:#ef4444;
  --yellow:#facc15; --violet:#a78bfa;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* top band */
#top{grid-column:1/3;border-bottom:1px solid var(--line);padding:10px 20px 10px;background:var(--bg2)}
.brand{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--faint)}
.brand b{color:var(--muted);font-weight:600}
.pitchrow{display:flex;gap:12px;align-items:flex-start;margin:6px 0 8px}
.qtag{flex:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;margin-top:3px}
#pitch{margin:0;font-size:15px;line-height:1.45;max-width:1260px}
#chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#chips .lab{font-size:12px;color:var(--faint);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;cursor:pointer}
.chip .bar{width:22px;height:5px;border-radius:3px}
.chip small{color:var(--faint);font-size:11.5px}
.chip[aria-pressed="true"]{border-color:currentColor;background:var(--bg3)}
.chip .main{font-size:10.5px;color:var(--bg);background:var(--yellow);border-radius:3px;padding:1px 5px;font-weight:700}

/* canvas */
#stage{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
#canvaswrap{flex:1;min-height:0;position:relative}
#plan{width:100%;height:100%;display:block}
#swipe{display:none}
#player{height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid var(--line);background:var(--bg2)}
#player button{background:var(--bg3);border:1px solid var(--line2);border-radius:6px;width:38px;height:36px;cursor:pointer;font-size:14px}
#player button:hover{border-color:var(--muted)}
#btn-play{width:46px!important;font-size:16px!important}
#ptext{flex:1;min-width:0;font-size:13.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ptext .n{color:var(--faint)}
#ptext b{font-weight:650}
code,.code{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#d7e3f0}
.manual{white-space:nowrap;font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:0 4px;margin-left:4px}

/* svg grammar */
#plan text{font-family:var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.coltitle{font-size:11px;letter-spacing:.12em;fill:var(--faint);font-weight:600}
.lbl{font-size:12.5px;fill:var(--text);font-weight:650}
.sub{font-size:11px;fill:var(--muted)}
.tiny{font-size:10.5px;fill:var(--faint)}
.verb{font-size:11px;fill:var(--muted);font-style:italic}
.blocname{font-size:13px;fill:var(--text);font-weight:700}
.line{transition:opacity .25s}
.line.dim{opacity:.16}
.st{cursor:pointer}
.st .dot{fill:var(--bg);stroke-width:4}
.st .num{font-size:11.5px;font-weight:800;fill:var(--text);stroke-width:0!important}
.st.off .dot{stroke:var(--line2)}
.st.off .num{fill:var(--faint)}
.st.now .dot{fill:currentColor}
.st.now .num{fill:var(--bg)}
.st.now .halo{opacity:1}
.st .halo{opacity:0;fill:none;stroke:currentColor;stroke-width:2;transition:opacity .2s}
.st:hover .dot,.st:focus-visible .dot{stroke-width:6}
.ring{fill:none;stroke:#dfe6ee;stroke-width:3}
.lblbox{fill:var(--bg2);opacity:.92}
.clickable{cursor:pointer}
.clickable:hover .blocname{text-decoration:underline}
.sel .dot{stroke:#fff!important}
#particle{filter:drop-shadow(0 0 6px currentColor);pointer-events:none}

/* panel */
#panel{overflow:auto;padding:18px 20px 40px;background:var(--bg)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:10px}
.crumb button{background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--muted)}
.crumb button:hover{color:var(--text);border-color:var(--muted)}
#panel h2{font-size:19px;margin:2px 0 6px;line-height:1.25}
#panel h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px;font-weight:650}
#panel p{margin:6px 0;font-size:14px;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:12.5px!important}
.kind{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:6px;font-weight:600}
.slot{border-top:1px solid var(--line);padding:10px 0 8px}
.slot>.k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:650;margin-bottom:4px}
.fait{font-size:16px;font-weight:600;line-height:1.4}
.notyet{border:1px dashed var(--amber);border-radius:8px;padding:2px 12px 6px;margin:10px 0;background:rgba(251,191,36,.04)}
.badge-notyet{display:inline-block;font-size:11px;color:var(--amber);border:1px solid rgba(251,191,36,.5);border-radius:4px;padding:1px 6px;margin:8px 0 2px;font-weight:600}
.facts{list-style:none;padding:0;margin:0}
.facts li{font-size:13.5px;line-height:1.5;padding:3px 0}
.src{font-family:var(--mono);font-size:11.5px;color:var(--blue);white-space:nowrap}
table.reg{width:100%;border-collapse:collapse;font-size:13px}
table.reg td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
table.reg td:last-child{text-align:right}
.ok{color:var(--green);font-weight:600;font-size:12.5px}
.no{color:var(--red);font-weight:600;font-size:12.5px}
.vu{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:5px 0;cursor:pointer;font-size:13.5px}
.vu:hover{border-color:var(--muted)}
.vu .bar{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
ol.stops{list-style:none;padding:0;margin:6px 0}
ol.stops li button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer}
ol.stops li button:hover{border-color:var(--line2)}
ol.stops li.now button{background:var(--bg3);border-color:var(--line2)}
ol.stops .n{flex:none;width:24px;height:24px;border-radius:50%;border:3px solid;display:grid;place-items:center;font-size:11px;font-weight:800}
ol.stops .t{font-size:14px;font-weight:600;line-height:1.3}
ol.stops .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.endpt{font-size:13.5px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.45}
.endpt b{color:var(--green)}
.endpt.out b{color:var(--amber)}
.branch{border-left:3px solid var(--red);padding:4px 10px;margin:8px 0;font-size:13.5px;line-height:1.45;background:var(--bg2);border-radius:0 6px 6px 0}
.branch.soft{border-left-color:var(--amber)}
details.tm{display:inline-block;margin:4px 0}
details.tm summary{cursor:pointer;font-size:11px;color:#c4b5fd;border:1px solid rgba(167,139,250,.45);border-radius:4px;padding:1px 6px;list-style:none;display:inline-block}
details.tm summary::-webkit-details-marker{display:none}
details.tm[open] summary{margin-bottom:4px}
details.tm div{font-size:12.5px;color:var(--muted);line-height:1.45;border-left:2px solid rgba(167,139,250,.45);padding-left:8px}
.qmap{font-size:13px;line-height:1.5;margin:0;padding-left:0;list-style:none}
.qmap li{padding:3px 0}
.qmap b{display:inline-block;width:28px;color:var(--yellow)}
.btn{display:inline-block;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;margin:6px 0}
.btn:hover{border-color:var(--muted)}
#strip{display:none}

/* phone */
@media (max-width:900px){
  body{display:block;height:auto;overflow:auto}
  #top{padding:10px 16px}
  #pitch{font-size:14.5px}
  .pitchrow{flex-direction:column;gap:6px}
  #panel ol.stops{display:none}
  #stage{border-right:0}
  #canvaswrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #plan{width:1040px;height:auto}
  #swipe{display:block;font-size:12px;color:var(--faint);padding:6px 16px;border-bottom:1px solid var(--line)}
  #player{position:sticky;bottom:0;z-index:5;height:auto;min-height:58px;padding:8px 12px}
  #strip{display:block;padding:8px 16px 4px;border-top:1px solid var(--line)}
  #panel{padding:16px 16px 60px;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){ .line,.st .halo{transition:none} }
</style>
</head>

<header id="top">

<main id="stage">

    <div id="ptext"></div>
  </div>
  <ol id="strip" class="stops" aria-label="La ligne allumée, en liste"></ol>
</main>

<aside id="panel" aria-live="polite"></aside>

  const b = COMP[e.composant].bloc;
  (LINES_BY_BLOC[b] = LINES_BY_BLOC[b] || new Set()).add(p.id);
}));
const ON_A_LINE = new Set(Object.keys(LINES_BY_BLOC));
M.parcours.forEach(p => p.etapes.forEach(e => (e.touche || []).forEach(b => { if (isUser(b)) ON_A_LINE.add(b); })));
const SHELF = M.blocs.filter(b => !ON_A_LINE.has(b.id));
function posOf(pid, stop) {
  if (!stop || !stop.comp) return null;
  if (stop.reply) return (LAYOUT.reply[pid] || {})[stop.comp] || null;
  return LAYOUT.comp[stop.comp] || null;
}
function branchComp(b) { return M.composants.find(c => (c.fichiers || []).includes(b.fichier)); }
function countWord(re) { return (JSON.stringify(M).match(re) || []).length; }
const ENTRY = (() => { const t = MAIN.etapes[0].touche || []; return t.find(isUser) || null; })();
const EXIT = (() => {
  for (let i = MAIN.etapes.length - 1; i >= 0; i--) {
    const c = COMP[MAIN.etapes[i].composant];
    if (c && BLOC[c.bloc] && BLOC[c.bloc].type === "database") return c.bloc;
  }
  return null;
})();
const MISSING_LAYOUT = [
  ...M.composants.filter(c => LINES_BY_COMP[c.id] && !LAYOUT.comp[c.id]).map(c => c.id),
  ...M.parcours.filter(p => !LAYOUT.paths[p.id]).map(p => p.id)
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
function wrap(t, n) {
  const words = String(t).split(/\s+/), L = []; let cur = "";
  for (const w of words) { if ((cur + " " + w).trim().length > n && cur) { L.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) L.push(cur);
  return L;
}
function txt(x, y, lines, cls, lh, anchor) {
  return lines.map((l, i) => `<text x="${x}" y="${y + i * lh}" class="${cls}" text-anchor="${anchor || "middle"}">${esc(l)}</text>`).join("");
}
const shortSrc = s => s.replace(/^.*\//, "");
const lines = (e) => e.lignes ? (e.lignes[0] === e.lignes[1] ? "l." + e.lignes[0] : "l." + e.lignes[0] + "-" + e.lignes[1]) : "";
const stepNums = (pid, key) => STOPS[pid].filter(s => s.key === key).map(s => s.i + 1);
const numLabel = ns => ns.length === 0 ? "" : ns.length === 1 ? String(ns[0]) : ns[0] + "–" + ns[ns.length - 1];
const tm = (note) => `<details class="tm"><summary>texte du modèle</summary><div>${esc(note)}</div></details>`;

/* ---------- state ---------- */
const S = { jid: MAIN.id, step: -1, playing: false, timer: null, view: { kind: "line" } };

}
function badge(x, y, label, fg, bg) {

  let g = "";

  stations.forEach(st => {

    const actions = onLit ? STOPS[S.jid].filter(s => s.key === st.key).map(s => lit.etapes[s.i].action) : [];
    const head = actions.length ? wrap(actions.join(" → "), 22) : [];

    let kx = 630, ky = 600, items = [];
    if (types.has("user")) items.push(["person", "Personne"]);

    g += `<rect x="618" y="584" width="406" height="104" rx="10" fill="var(--bg2)" stroke="var(--line)"/>`;

    items.forEach((it, i) => {

/* ---------- particle ---------- */
let anim = 0;
function hideParticle() { cancelAnimationFrame(anim); $("#particle").setAttribute("opacity", "0"); }
function moveParticle(from, to) {
  const el = $("#particle");
  if (REDUCED) { el.setAttribute("opacity", "0"); return; }
  const stops = STOPS[S.jid], end = posOf(S.jid, stops[to]);
  if (!end) { hideParticle(); return; }
  const start = from < 0 ? (LAYOUT.start[S.jid] || end) : (posOf(S.jid, stops[from]) || end);
  const vias = LAYOUT.via[S.jid] || {};
  let mid = [];
  if (to === from + 1) mid = vias[to] || [];
  else if (to === from - 1) mid = (vias[from] || []).slice().reverse();
  const pts = [start, ...mid, end];
  const seg = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  el.setAttribute("fill", COLOR[S.jid]); el.style.color = COLOR[S.jid]; el.setAttribute("opacity", "1");
  cancelAnimationFrame(anim);
  const t0 = performance.now(), dur = Math.min(1100, 350 + total * 1.4);
  const frame = now => {
    let t = Math.min(1, (now - t0) / dur); t = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    let d = t * total, i = 0;
    while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
    const f = seg[i] ? Math.min(1, d / seg[i]) : 1, a = pts[i], b = pts[i + 1] || pts[i];
    el.setAttribute("cx", a[0] + (b[0] - a[0]) * f); el.setAttribute("cy", a[1] + (b[1] - a[1]) * f);
    if (t < 1) anim = requestAnimationFrame(frame);
  };
  anim = requestAnimationFrame(frame);
}

/* ---------- player ---------- */
function renderPlayer() {
  const p = JOUR[S.jid], N = p.etapes.length;
  $("#btn-play").textContent = S.playing ? "❚❚" : "▶";
  $("#btn-play").setAttribute("aria-label", S.playing ? "Pause" : "Lire la ligne");
  if (S.step < 0) {
    $("#ptext").innerHTML = `<span class="n">Ligne « ${esc(p.nom)} » · ${N} étapes.</span> Appuyez sur ▶ ou cliquez une station pour suivre la donnée.`;
    return;
  }
  const e = p.etapes[S.step];
  $("#ptext").innerHTML = `<span class="n">étape ${S.step + 1} sur ${N} ·</span> <b>${esc(e.action)}</b> — ${esc(e.simple)} <span class="n">·</span> <code title="${esc(e.fichier)}">${esc(e.fichier)} ${lines(e)}</code>${e.manuel ? '<span class="manual">à la main</span>' : ""}`;
}
function stopTimer() { S.playing = false; clearInterval(S.timer); S.timer = null; }
function goStep(n, keepPlaying) {
  const N = JOUR[S.jid].etapes.length;
  n = Math.max(0, Math.min(N - 1, n));
  if (!keepPlaying) stopTimer();
  const prev = S.step; S.step = n;
  renderAll(); moveParticle(prev, n);
}
function play() {
  const N = JOUR[S.jid].etapes.length;
  if (S.step >= N - 1) S.step = -1;
  S.playing = true; clearInterval(S.timer);
  goStep(S.step + 1, true);
  S.timer = setInterval(() => {
    if (S.step >= JOUR[S.jid].etapes.length - 1) { stopTimer(); renderPlayer(); return; }
    goStep(S.step + 1, true);
  }, 3400);
}
function selectLine(pid) { stopTimer(); hideParticle(); S.jid = pid; S.step = -1; S.view = { kind: "line" }; renderAll(); }

/* ---------- panel ---------- */
const crumb = (parts) => `<div class="crumb"><button data-act="back">‹ Plan</button>${parts.map(p => "<span>›</span><span>" + esc(p) + "</span>").join("")}</div>`;
const KIND = { user: ["Personne", "var(--green)"], backend: ["Service", "var(--blue)"], database: ["Stockage", "var(--amber)"], docs: ["Atelier", "var(--faint)"], infra: ["Atelier", "var(--faint)"] };
const kindTag = t => { const k = KIND[t] || [t, "var(--faint)"]; return `<span class="kind" style="color:var(--bg);background:${k[1]}">${esc(k[0])}</span>`; };
function factList(items) {
  return `<ul class="facts">${items.map(f => `<li>${esc(f.t)} <span class="code">${esc(f.code)}</span> <span class="src" title="${esc(f.src)}">${esc(shortSrc(f.src))}</span></li>`).join("")}</ul>`;
}
function panelLine() {
  const p = JOUR[S.jid], stops = STOPS[p.id];
  const notes = [];
  const sameComp = p.etapes.filter((e, i) => i > 0 && e.composant === p.etapes[i - 1].composant).length;
  const manual = p.etapes.filter(e => e.manuel).length;
  if (sameComp) notes.push(`${sameComp + 1} étapes de suite sur le même composant, donc la même station${manual ? " ; " + manual + " sont faites à la main (manuel: true) mais restent rattachées à « " + (COMP[p.etapes[0].composant] || {}).nom + " »" : ""}.`);
  if (!(p.etapes[0].touche || []).some(isUser)) notes.push("La 1re étape ne touche aucune personne : le modèle ne dit pas d'où vient la requête (pas de pièce de départ).");
  const nCR = countWord(/comptes? rendus?/gi), nEv = countWord(/[ée]v[ée]nements?/gi);
  let h = `<div class="crumb"><span>Plan</span><span>›</span><span>ligne allumée</span></div>`;
  h += `<h2><span class="bar" style="display:inline-block;width:22px;height:6px;border-radius:3px;background:${COLOR[p.id]};vertical-align:middle;margin-right:8px"></span>${esc(p.nom)}</h2>`;
  if (p === MAIN) h += `<p class="small muted">Ligne principale : c'est celle qui passe par le plus de composants (${distinctComps(p)}). Le modèle n'a pas encore de champ « principal ».</p>`;
  h += `<p class="small muted">Déclencheur : ${esc(p.declencheur)}</p>`;
  h += `<div class="endpt"><b>▶ Départ</b> — ${esc(p.depart)}</div>`;
  h += `<ol class="stops">${p.etapes.map((e, i) => {
    const c = COMP[e.composant];
    return `<li class="${i === S.step ? "now" : ""}"><button data-step="${i}"><span class="n" style="border-color:${COLOR[p.id]}">${i + 1}</span><span class="t">${esc(e.action)}${e.manuel ? '<span class="manual">à la main</span>' : ""}<small>${esc(c ? c.nom : "—")}${stops[i].reply ? " · retour vers l'expéditeur" : ""}</small></span></button></li>`;
  }).join("")}</ol>`;
  h += `<div class="endpt out"><b>■ Arrivée</b> — ${esc(p.fin)}</div>`;
  h += `<button class="btn" data-act="play">▶ Suivre cette ligne</button>`;
  notes.forEach(n => { h += "<div>" + tm(n) + "</div>"; });
  if (p.branches && p.branches.length) {
    h += `<h3>Cas particuliers (${p.branches.length})</h3>`;
    p.branches.forEach((b, bi) => {
      const code = /\b4\d\d\b/.test(b.alors);
      h += `<div class="branch ${code ? "" : "soft"}"><b>${esc(b.quand)}</b><br><span class="muted">${esc(b.alors)}</span><br><span class="src">${esc(b.fichier)} ${lines(b)}</span></div>`;
    });
    h += tm("Ces textes sont écrits pour un développeur (ex. « 401 {\"detail\": … } »). Le modèle n'a pas encore de version simple (quand_simple / alors_simple).");
  }
  if (p === MAIN) h += `<div>${tm(`La même donnée a deux noms dans le modèle : « compte(s) rendu(s) » ${nCR} fois, « événement(s) » ${nEv} fois. La pastille du plan garde « compte rendu », le nom du parcours principal.`)}</div>`;
  h += `<h3>Où lire les 5 réponses</h3><ul class="qmap">
    <li><b>Q1</b>la phrase en haut : ce que fait le projet, pour qui.</li>
    <li><b>Q2</b>les badges ▶ ENTRÉE et SORTIE ■, les titres de colonnes, la pastille « compte rendu ».</li>
    <li><b>Q3</b>les stations et cadres sur les lignes, les anneaux de correspondance, et l'Atelier (ce qui n'est pas dans le flux).</li>
    <li><b>Q4</b>▶ en bas : les stations s'allument une par une, avec le fichier.</li>
    <li><b>Q5</b>cliquez une station : sa fiche donne les réglages avec fichier:ligne.</li></ul>`;
  h += `<h3>Limites de cette maquette</h3><p class="small muted">Les positions sont posées à la main ; l'ordre, les numéros, les étiquettes, les anneaux et les embranchements sont calculés depuis le modèle.${MISSING_LAYOUT.length ? " Sans position : " + esc(MISSING_LAYOUT.join(", ")) + "." : ""}</p>`;
  h += `<p class="small muted">Risque d'échelle : sur JusticIA, la ligne « Poser une question juridique et recevoir l'analyse » a 16 étapes sur 8 composants, avec des allers-retours. Il faudra des « phases » pour la plier en 9 stations au plus.</p>`;
  return h;
}
function panelComp(id) {
  const c = COMP[id], b = BLOC[c.bloc], F = FACTS[id];
  let h = crumb([b ? b.nom : c.bloc, c.nom]);
  h += `<h2>${esc(c.nom)}</h2>`;
  h += `<div class="slot"><div class="k">Fait</div><div class="fait">${esc(c.en_bref)}</div><p class="small muted">${esc(c.role)}</p></div>`;
  h += `<div class="notyet"><span class="badge-notyet">pas encore dans le modèle — lu dans le code</span>`;
  if (F) {
    h += `<div class="slot" style="border:0"><div class="k">Reçoit</div>${factList(F.recoit)}</div>`;
    h += `<div class="slot"><div class="k">Rend</div>${factList(F.rend)}</div>`;
    h += `<div class="slot"><div class="k">Réglages</div><table class="reg">${F.reglages.map(r => `<tr><td>${esc(r.nom)}<br><span class="code">${esc(r.code)}</span></td><td><span class="src" title="${esc(r.src)}">${esc(shortSrc(r.src))}</span></td></tr>`).join("")}</table></div>`;
  } else h += `<p class="small muted">Rien de relevé pour ce composant.</p>`;
  h += `</div>`;
  h += `<div class="slot"><div class="k">Où</div>${(c.expose || []).map(x => `<div style="padding:3px 0;font-size:13.5px"><span class="code">${esc(x.quoi)}</span><br><span class="src">${esc(x.fichier)} ${lines(x)}</span> ${x.verifie ? '<span class="ok">✓ vérifié</span>' : '<span class="no">non vérifié</span>'}</div>`).join("")}`;
  h += `<p class="small muted">Fichiers : ${(c.fichiers || []).map(f => `<span class="src">${esc(f)}</span>`).join(", ")}</p></div>`;
  const seen = [];
  M.parcours.forEach(p => p.etapes.forEach((e, i) => { if (e.composant === id) seen.push({ p, e, i }); }));
  h += `<div class="slot"><div class="k">Vu dans</div>${seen.length ? seen.map(s => `<button class="vu" data-play="${s.p.id}" data-from="${s.i}"><span class="bar" style="background:${COLOR[s.p.id]}"></span>${esc(s.p.nom)} · étape ${s.i + 1} — ${esc(s.e.action)}</button>`).join("") : '<p class="small muted">Aucun parcours ne passe ici.</p>'}</div>`;
  return h;
}
function panelBloc(id) {
  const b = BLOC[id];
  const comps = M.composants.filter(c => c.bloc === id);
  let h = crumb([b.nom]);
  h += `<h2>${esc(b.nom)}</h2><p>${kindTag(b.type)}<span class="muted small">${esc(b.techno)}</span></p>`;
  h += `<div class="slot"><div class="k">Fait</div><div class="fait">${esc(b.en_bref)}</div><p class="small muted">${esc(b.role)}</p></div>`;
  if (!ON_A_LINE.has(id)) h += `<p class="small" style="color:var(--amber)">Aucune ligne ne passe ici : cette pièce est à côté du flux de données.</p>`;
  h += `<div class="slot"><div class="k">Reçoit</div><ul class="facts">${(b.entre || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  h += `<div class="slot"><div class="k">Rend</div><ul class="facts">${(b.sort || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  if (comps.length) h += `<div class="slot"><div class="k">Stations à l'intérieur (${comps.length})</div>${comps.map(c => `<button class="vu" data-comp-open="${c.id}">${esc(c.nom)} <span class="muted">— ${esc(c.en_bref)}</span></button>`).join("")}</div>`;
  h += `<div class="slot"><div class="k">Où</div>${(b.code || []).map(x => `<div><span class="src">${esc(x.chemin)}</span></div>`).join("")}<p class="small muted">Indices : ${esc(b.indices)}</p></div>`;
  return h;
}
function panelBranch(bi) {
  const p = JOUR[S.jid], b = p.branches[bi], c = branchComp(b);
  let h = crumb([p.nom, "cas particulier"]);
  h += `<h2>${esc(b.quand)}</h2>`;
  h += `<div class="branch ${/\b4\d\d\b/.test(b.alors) ? "" : "soft"}">${esc(b.alors)}</div>`;
  h += tm("Texte écrit pour un développeur ; pas encore de version simple (alors_simple) dans le modèle.");
  h += `<div class="slot"><div class="k">Où</div><span class="src">${esc(b.fichier)} ${lines(b)}</span> ${b.verifie ? '<span class="ok">✓ vérifié</span>' : '<span class="no">non vérifié</span>'}</div>`;
  if (c) h += `<button class="vu" data-comp-open="${c.id}">Ouvrir la station « ${esc(c.nom)} »</button>`;
  return h;
}
function renderPanel() {
  const v = S.view;
  let h = v.kind === "comp" && COMP[v.id] ? panelComp(v.id)
    : v.kind === "bloc" && BLOC[v.id] ? panelBloc(v.id)
    : v.kind === "branch" && JOUR[S.jid].branches[v.id] ? panelBranch(v.id)
    : panelLine();
  $("#panel").innerHTML = h;
}

/* ---------- phone strip (same line, as a vertical list) ---------- */
function renderStrip() {
  const p = JOUR[S.jid];
  $("#strip").innerHTML = p.etapes.map((e, i) => {
    const c = COMP[e.composant];
    const br = (p.branches || []).filter(b => { const bc = branchComp(b); return bc && bc.id === e.composant && STOPS[p.id].find(s => s.comp === e.composant).i === i; });
    return `<li class="${i === S.step ? "now" : ""}"><button data-step="${i}" data-open="${e.composant || ""}"><span class="n" style="border-color:${COLOR[p.id]}">${i + 1}</span><span class="t">${esc(e.action)}<small>${esc(c ? c.nom : "—")} · ${esc(e.fichier)} ${lines(e)}</small>${br.map(b => `<small style="color:var(--red)">↳ ${esc(b.quand)}</small>`).join("")}</span></button></li>`;
  }).join("");
}

/* ---------- chips ---------- */
function renderChips() {
  const box = $("#chips");
  box.querySelectorAll(".chip").forEach(n => n.remove());
  [MAIN, ...M.parcours.filter(p => p !== MAIN)].forEach(p => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.line = p.id; b.style.color = COLOR[p.id];
    b.setAttribute("aria-pressed", String(p.id === S.jid));
    b.innerHTML = `<span class="bar" style="background:${COLOR[p.id]}"></span><span style="color:var(--text)">${esc(p.nom)}</span>${p === MAIN ? '<span class="main">principale</span>' : ""}<small>${p.etapes.length} étapes</small>`;
    box.appendChild(b);
  });
}

function renderAll() { renderPlan(); renderPlayer(); renderPanel(); renderStrip(); renderChips(); }

/* ---------- events ---------- */
function openComp(id) { if (COMP[id]) { S.view = { kind: "comp", id }; renderAll(); } }
function onStation(key, comp) {
  const idx = STOPS[S.jid].findIndex(s => s.key === key);
  S.view = { kind: "comp", id: comp };
  if (idx >= 0) goStep(idx); else { stopTimer(); renderAll(); }
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-key],[data-bloc],[data-branch],[data-line],[data-step],[data-act],[data-play],[data-comp-open]");
  if (!t) return;
  if (t.dataset.key) return onStation(t.dataset.key, t.dataset.comp);
  if (t.dataset.bloc) { S.view = { kind: "bloc", id: t.dataset.bloc }; return renderAll(); }
  if (t.dataset.branch !== undefined) { S.view = { kind: "branch", id: Number(t.dataset.branch) }; return renderAll(); }
  if (t.classList.contains("chip")) return selectLine(t.dataset.line);
  if (t.dataset.step !== undefined) {
    if (t.dataset.open && window.matchMedia("(max-width:900px)").matches) S.view = { kind: "comp", id: t.dataset.open };
    return goStep(Number(t.dataset.step));
  }
  if (t.dataset.compOpen) return openComp(t.dataset.compOpen);
  if (t.dataset.play) { selectLine(t.dataset.play); S.step = Number(t.dataset.from) - 1; return play(); }
  if (t.dataset.act === "back") { S.view = { kind: "line" }; return renderAll(); }
  if (t.dataset.act === "play") return play();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("g[tabindex]")) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
  if (ev.target.closest && ev.target.closest("button,summary") && (ev.key === " " || ev.key === "Enter")) return;
  if (ev.key === "ArrowRight") { ev.preventDefault(); goStep(S.step + 1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); if (S.step > 0) goStep(S.step - 1); }
  else if (ev.key === " ") { ev.preventDefault(); S.playing ? (stopTimer(), renderPlayer()) : play(); }
  else if (ev.key === "Escape") { S.view = { kind: "line" }; renderAll(); }
});
$("#btn-play").addEventListener("click", ev => { ev.stopPropagation(); S.playing ? (stopTimer(), renderPlayer()) : play(); });
$("#btn-next").addEventListener("click", ev => { ev.stopPropagation(); goStep(S.step + 1); });
$("#btn-prev").addEventListener("click", ev => { ev.stopPropagation(); if (S.step > 0) goStep(S.step - 1); });

$("#pitch").textContent = M.pitch;
if (MISSING_LAYOUT.length) console.warn("Umbra mockup: no position for", MISSING_LAYOUT);
renderAll();
</script>
</body>
</html>
