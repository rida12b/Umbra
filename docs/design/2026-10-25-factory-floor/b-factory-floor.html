<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbra · Plan d'usine</title>
<style>
:root{
  --bg:#0e1116; --surface:#161a21; --surface2:#1d222b; --surface3:#252b35;
  --border:#2c333e; --border2:#3a4250;
  --text:#e8ebef; --muted:#a3adba; --faint:#7d8794;
  --person:#34d399; --service:#60a5fa; --store:#f5b14c; --data:#f4b740;
  --refus:#f87171; --control:#8b95a3; --code:#c4b5fd; --ok:#4ade80;
  --hl:#facc15;
  --panel-w:400px; --header-h:48px;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px}
header{height:var(--header-h);display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--border);background:#11151b;position:relative;z-index:5}
.brand{font-weight:700;white-space:nowrap}
.brand span{color:var(--muted);font-weight:400}
#crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
#crumbs button{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--muted);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;max-width:260px}
#crumbs button:hover{background:var(--surface2);color:var(--text)}
#crumbs button.cur{color:var(--text);font-weight:600;cursor:default;background:none}
#crumbs .sep{color:var(--faint)}
#backBtn{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:5px 10px;cursor:pointer;white-space:nowrap}
#backBtn[hidden]{display:none}
.app{display:flex;height:calc(100% - var(--header-h))}
#canvasWrap{flex:1;min-width:0;position:relative;overflow:hidden}
#canvas{height:100%;position:relative;overflow-y:auto;overflow-x:hidden}
#panel{width:var(--panel-w);flex:none;border-left:1px solid var(--border);background:#12161c;overflow-y:auto;padding:18px 20px 40px}

/* top band */
#band{padding:16px 24px 6px}
.qlabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
#pitch{margin:4px 0 10px;font-size:15.5px;line-height:1.5;max-width:920px}
#keyRow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);
  padding:8px 0 4px;border-top:1px solid var(--border)}
#keyRow .k{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sw{display:inline-block}
.sw-person{width:12px;height:12px;border-radius:50%;border:2px solid var(--person)}
.sw-service{width:16px;height:11px;border-radius:3px;border:1px solid var(--border2);border-left:4px solid var(--service)}
.sw-store{width:12px;height:13px;border:2px solid var(--store);border-radius:50%/30%}
.sw-tag{width:16px;height:10px;border:1px dashed var(--control);border-radius:3px}
.sw-data{width:22px;height:5px;background:var(--data);border-radius:3px}
.sw-reply{width:22px;border-top:2px dashed var(--data)}
.sw-ctl{width:22px;border-top:1px solid var(--control)}
.sw-refus{width:9px;height:9px;background:var(--refus)}
.sw-code{width:16px;height:10px;border:1px dashed var(--code);border-radius:3px}

/* stage */
#stageWrap{padding:6px 16px 0}
#stage{position:relative;transition:height .45s ease}
#wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{position:absolute;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  overflow:hidden;transition:opacity .3s ease, box-shadow .2s ease, border-color .2s ease}
.node.gone{opacity:0;pointer-events:none}
.node .inner{padding:10px 12px;height:100%;display:flex;flex-direction:column;gap:4px}
.nm{font-weight:650;font-size:15px;line-height:1.25}
.eb{color:var(--muted);font-size:12.5px;line-height:1.35}
.kind{font-size:11px;color:var(--faint)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;
  border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-in{background:var(--person);color:#06281b}
.b-out{background:var(--store);color:#2c1a00}
.lost{font-size:12px;color:var(--store);font-style:italic}

.k-user{border:1px solid #23493b;background:#121d1a}
.k-user .glyph{width:30px;height:30px;flex:none}
.k-service{border-left:5px solid var(--service)}
.k-store{border:2px solid var(--store);background:#1f1a10;border-radius:50% / 22px}
.k-store .inner{padding:24px 16px 14px}
.roomOpen::before{display:none !important}
.k-store::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:44px;border:2px solid var(--store);
  border-radius:50%;pointer-events:none}
.room .enter{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cnt{font-size:12px;color:var(--muted)}
.preview{display:flex;flex-wrap:wrap;align-items:center;gap:4px 4px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.pv{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid #2f4b70;border-radius:6px;padding:2px 6px 2px 3px}
.pv .num,.k-service .num{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--data);color:var(--data);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none}
.pvA{color:var(--data)}
.lnk{background:none;border:0;color:var(--service);cursor:pointer;padding:2px 0;font-size:13px}
.lnk:hover{text-decoration:underline}
.clickable{cursor:pointer}
.clickable:hover{border-color:var(--border2)}
.k-user.clickable:hover{border-color:#2f6b55}
.door{background:#13171d;border-style:dashed}
.door .inner{padding:8px 10px;gap:6px}
.door .dl{font-size:12px;color:var(--muted);line-height:1.35}
.door .dl b{color:var(--text);font-weight:600}
.door.k-store{border-radius:12px;background:#1a1610}
.door.k-store::before{display:none}
.chipline{display:flex;flex-wrap:wrap;gap:4px}
.mchip{font-size:11.5px;border:1px solid var(--border2);border-radius:6px;padding:2px 6px;background:var(--surface2)}
.node.lit{box-shadow:0 0 0 2px var(--hl),0 0 22px rgba(250,204,21,.25);border-color:var(--hl)}
.side{border-style:solid}
.machine{background:var(--surface2);border:1px solid #2f4b70;cursor:pointer}
.machine.m-store{border-color:#6b5124}
.machine:hover{border-color:var(--service)}
.machine .num{width:22px;height:22px;border-radius:50%;border:2px solid var(--data);color:var(--data);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.machine .top{display:flex;gap:8px;align-items:flex-start}
.machine .nm{font-size:14px}
.machine .io{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:3px;font-size:11px}
.io span{border:1px dashed var(--code);color:var(--code);border-radius:5px;padding:1px 5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.io .out{text-align:right}
.machine.sel{border-color:var(--service);box-shadow:0 0 0 2px var(--service)}
.machine.done .num{background:var(--data);color:#231800}
.wband{background:transparent;border:1px dashed var(--control);color:var(--muted);cursor:pointer}
.wband .inner{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px}
.wband b{color:var(--text)}
.tagc{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--control);
  border-radius:4px;padding:1px 6px;color:var(--control);white-space:nowrap}
.chute{background:#1f1416;border:1px solid #5b2a2e;border-left:4px solid var(--refus)}
.chute .inner{padding:7px 10px;gap:2px}
.chute .code{color:var(--refus);font-weight:800;font-size:15px}
.chute .eb,.note .eb{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note{background:#1d1a12;border:1px dashed #6b5124}
.note .code{color:var(--store);font-weight:700;font-size:12px}
.roomTitle{position:absolute;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .3s}
.wl{position:absolute;transform:translate(-50%,-50%);font-size:12px;background:var(--bg);color:var(--text);
  padding:1px 7px;border-radius:6px;white-space:nowrap;pointer-events:none;transition:opacity .25s;border:1px solid var(--border)}
.wl.ctl{color:var(--control)}
.wl.reply{border-style:dashed;border-color:#6b5a2a;white-space:normal;max-width:380px;text-align:center}
.wl.lit{border-color:var(--hl);color:var(--hl)}
.wl small{display:block;color:var(--muted);font-size:11px}
#token{position:absolute;left:0;top:0;z-index:4;pointer-events:none;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;
  font-size:11px;font-weight:700;background:var(--data);color:#241900;border-radius:999px;padding:2px 8px;
  box-shadow:0 0 14px rgba(244,183,64,.6);opacity:0;white-space:nowrap}
.mtm{display:inline-block;font-size:10.5px;color:#fbbf24;border:1px solid #6b5a2a;border-radius:4px;padding:0 5px;
  margin-left:4px;vertical-align:1px;white-space:nowrap;font-weight:500}

/* strip */
#strip{margin:14px 16px 20px;border:1px dashed var(--border2);border-radius:12px;padding:10px 14px}
#strip .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.tag{border:1px dashed var(--control);border-radius:8px;padding:6px 10px;background:#14181e;cursor:pointer;text-align:left;max-width:100%}
.tag:hover{border-color:var(--muted)}
.tag .eb{font-size:12px}
#projBtn{border:1px dashed var(--code);border-radius:8px;padding:6px 10px;background:#17141f;cursor:pointer;text-align:left}

/* plate */
#plate{position:absolute;left:12px;right:12px;bottom:0;z-index:6;background:#151a22;border:1px solid var(--border2);
  border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.55);max-height:58%;overflow:auto;
  transform:translateY(105%);transition:transform .35s ease;padding:14px 18px 18px}
#plate{visibility:hidden}
#plate.open{transform:translateY(0);visibility:visible}
#canvas.plate-on #strip{margin-bottom:62vh}
.plHead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.plHead h2{margin:0;font-size:18px}
.plHead .x{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px 10px;cursor:pointer}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-width:0}
.slot.wide{grid-column:1 / -1}
.slot h3{margin:0 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.slot ul{margin:0;padding-left:16px}
.slot li{margin:2px 0}
.codeBadge{display:inline-block;font-size:10.5px;color:var(--code);border:1px dashed var(--code);border-radius:4px;padding:0 5px;margin-bottom:5px}
.cite{color:var(--code);overflow-wrap:anywhere}
.ok{color:var(--ok);font-size:12px}
table.rg{width:100%;border-collapse:collapse;font-size:12.5px}
table.rg td,table.rg th{border-top:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:top}
table.rg th{color:var(--faint);font-weight:600;font-size:11px;border-top:0}
table.rg code{color:#fde68a;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-word}
.no{color:var(--refus);font-weight:600}
.vu button{background:none;border:0;color:var(--service);cursor:pointer;text-align:left;padding:2px 0}
.vu .other{color:var(--muted)}
.vu .det{font-size:12px;color:var(--muted);margin:2px 0 6px 0}

/* panel */
#panel h1{font-size:20px;margin:2px 0 6px}
#panel h2{font-size:14px;margin:18px 0 8px}
.here{font-size:12px;color:var(--faint)}
.card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);margin-bottom:8px}
.play{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:#3a2d08;border-color:var(--data);color:#fde68a;font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.chap{margin:14px 0 6px;font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.st{display:flex;gap:10px;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;padding:8px 10px;
  margin-bottom:6px;cursor:pointer;background:var(--surface)}
.st:hover{border-color:var(--border2)}
.st.on{border-left-color:var(--hl);background:#1f1d12}
.st .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--data);color:var(--data);display:inline-flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.st .a{font-weight:600}
.st .s{color:var(--muted);font-size:13px}
.st .f{font-size:11.5px;color:var(--code);word-break:break-all}
.cas{border-left:3px solid var(--refus);padding:4px 10px;margin:4px 0 8px;font-size:12.5px;color:var(--muted)}
.cas b{color:var(--text);font-weight:600}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted)}
details ul{padding-left:18px;color:var(--muted);font-size:13px}
.prog{font-size:12px;color:var(--muted)}
#edgeHint{position:fixed;z-index:7;background:var(--hl);color:#221a00;font-weight:700;font-size:12px;border:0;
  border-radius:999px;padding:4px 10px;cursor:pointer;display:none}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
@media (max-width: 900px){
  html,body{height:auto}
  .app{display:block;height:auto}
  #canvasWrap{overflow:visible}
  #canvas{overflow:visible;height:auto}
  #panel{width:auto;border-left:0;border-top:1px solid var(--border)}
  #band{padding:14px 16px 4px}
  #pitch{font-size:14.5px}
  #plate{position:fixed;left:0;right:0;max-height:78vh}
  .slots{grid-template-columns:1fr}
  .brand span{display:none}
  #crumbs button{max-width:120px}
}
</style>
</head>

<header>
  <div class="brand">Umbra <span>/ watchdog</span></div>
  <nav id="crumbs" aria-label="Où je suis"></nav>

</header>
<div class="app">
 <div id="canvasWrap">
  <main id="canvas">
    <section id="band">
      <div class="qlabel">Ce que fait ce projet, pour qui</div>

  <section id="plate" aria-live="polite"></section>
 </div>
  <aside id="panel"></aside>
</div>
<button id="edgeHint"></button>

  k.push('<span class="k"><span class="sw sw-data"></span>Donnée (tapis)</span>', '<span class="k"><span class="sw sw-reply"></span>Réponse</span>',
    '<span class="k"><span class="sw sw-ctl"></span>Contrôle, pas de donnée</span>', '<span class="k"><span class="sw sw-refus"></span>Refus</span>',
    '<span class="k"><span class="sw sw-code"></span>Lu dans le code, pas encore dans le modèle</span>');
  $('keyRow').innerHTML = k.join('');
  $('strip').innerHTML = `<div class="qlabel">Autour du projet (ne tourne pas)</div><div class="row">${STRIP.map(b => {
    const fl = M.flux.filter(f => f.de === b.id).map(f => `${f.verbe} « ${B[f.vers].nom} » — contrôle, pas de donnée`);
    return `<button class="tag" data-bloc="${b.id}"><div style="font-weight:600">${esc(b.nom)}</div><div class="eb">${esc(b.en_bref)}</div>${fl.map(t => `<div class="kind">${esc(t)}</div>`).join('')}</button>`;
  }).join('')}<button id="projBtn" data-act="project"><div style="font-weight:600">Réglages du projet</div><div class="eb">.env.example et port réel</div></button></div>`;
}

/* ---------- navigation ---------- */
function renderCrumbs() {
  const c = []; c.push({ t: "L'usine", go: 'floor', cur: !S.room });
  if (S.room) c.push({ t: B[S.room].nom, go: 'room', cur: !(S.plate && S.plate.kind === 'comp') });
  if (S.plate && S.plate.kind === 'comp') c.push({ t: C[S.plate.id].nom, cur: true });
  $('crumbs').innerHTML = c.map((x, i) => `${i ? '<span class="sep">›</span>' : ''}<button class="${x.cur ? 'cur' : ''}" ${x.go && !x.cur ? `data-crumb="${x.go}"` : ''}>${esc(x.t)}</button>`).join('');
  $('backBtn').hidden = !S.room && !S.plate;
}
function render(animate) { fillNodes(); relayout(animate); renderPanel(); renderPlate(); renderCrumbs(); }
function enterRoom(r) { stop(); if (!ROOMS.includes(r)) { S.plate = { kind: 'bloc', id: r }; render(false); return; } S.room = r; S.plate = null; S.step = 0; render(true); canvas.scrollTop = 0; }
function goFloor() { stop(); S.room = null; S.step = 0; S.plate = null; render(true); }
function goStep(n) {
  n = Math.max(1, Math.min(STEPS.length, n));
  S.step = n;
  if (!S.room) { S.room = blocOf(STEPS[n - 1].composant); render(true); return; }
  fillNodes(); drawWires(cur); placeToken(); renderPanel(); renderCrumbs();
}
function stop() { S.playing = false; if (timer) { clearInterval(timer); timer = null; } }
function togglePlay() {
  if (S.playing) { stop(); renderPanel(); return; }
  S.playing = true; S.plate = null; renderPlate();
  if (!S.step || S.step >= STEPS.length) goStep(1); else renderPanel();
  timer = setInterval(() => { if (S.step >= STEPS.length) { stop(); renderPanel(); return; } goStep(S.step + 1); }, 2600);
}
function up() {
  if (S.plate) { S.plate = null; fillNodes(); renderPlate(); renderCrumbs(); return; }
  if (S.room) goFloor();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-enter],[data-enter-door],[data-act],[data-step],[data-goto],[data-crumb],[data-bloc],[data-other],.node');
  if (!t) return;
  if (t.dataset.enter) return enterRoom(t.dataset.enter);
  if (t.dataset.enterDoor) return enterRoom(t.dataset.enterDoor);
  if (t.dataset.other) { S.openOther[t.dataset.other] = !S.openOther[t.dataset.other]; return renderPanel(); }
  const a = t.dataset.act;
  if (a === 'play') { S.room = blocOf(STEPS[0].composant); S.plate = null; render(true); setTimeout(togglePlay, 500); return; }
  if (a === 'toggle') return togglePlay();
  if (a === 'prev') { stop(); return goStep((S.step || 2) - 1); }
  if (a === 'next') { stop(); return goStep((S.step || 0) + 1); }
  if (a === 'closePlate') return up();
  if (a === 'project') { stop(); S.plate = { kind: 'project' }; renderPlate(); renderCrumbs(); return; }
  if (t.dataset.step) { stop(); return goStep(+t.dataset.step); }
  if (t.dataset.goto) { stop(); S.plate = null; renderPlate(); return goStep(+t.dataset.goto); }
  if (t.dataset.crumb) { if (t.dataset.crumb === 'floor') return goFloor(); S.plate = null; fillNodes(); renderPlate(); renderCrumbs(); return; }
  if (t.dataset.bloc) { stop(); S.plate = { kind: 'bloc', id: t.dataset.bloc }; renderPlate(); renderCrumbs(); return; }
  if (t.classList.contains('node')) {
    const id = t.dataset.id, kind = id.slice(0, 2), key = id.slice(2);
    if (kind === 'm:' || kind === 'w:') { stop(); S.plate = { kind: 'comp', id: key }; fillNodes(); renderPlate(); renderCrumbs(); renderPanel(); return; }
    if (kind === 'b:') {
      const mode = t.dataset.mode;
      if (mode === 'floor' && ROOMS.includes(key)) return enterRoom(key);
      if (mode === 'doorL' || mode === 'doorR') return enterRoom(key);
      if (mode !== 'open') { stop(); S.plate = { kind: 'bloc', id: key }; renderPlate(); renderCrumbs(); }
    }
  }
});
$('backBtn').addEventListener('click', up);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') up();
  else if (S.room && e.key === 'ArrowRight') { stop(); goStep((S.step || 0) + 1); }
  else if (S.room && e.key === 'ArrowLeft') { stop(); goStep((S.step || 2) - 1); }
});
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fillNodes(); relayout(false); }, 80); });
renderStatic();
render(false);
</script>
</body>
