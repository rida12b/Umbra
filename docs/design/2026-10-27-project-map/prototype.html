<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbra — carte du projet</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f3; --ink:#15181d; --ink-2:#4a5160; --ink-3:#6f7786;
  --line:#d6dbe3; --box:#ffffff; --box-stroke:#8e97a6; --stub:#e9ecf0; --stub-ink:#646c7b; --stub-stroke:#c9ced7;
  --accent:#2457e6; --accent-soft:#e7edff; --accent-ink:#ffffff; --halo:#f5f6f8; --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.08);
  --warn-bg:#fff6e0; --warn-line:#e7b74a; --warn-ink:#6b4b00;
  --term-bg:#1b1c1f; --term-ink:#e6e6e6; --term-dim:#8b8f98; --term-acc:#d97757;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#161a20; --surface-2:#1d2229; --ink:#e7eaef; --ink-2:#aab1bd; --ink-3:#8a93a3;
    --line:#2a3039; --box:#1a1f26; --box-stroke:#5d6778; --stub:#1f242c; --stub-ink:#8d96a5; --stub-stroke:#323946;
    --accent:#7096ff; --accent-soft:#1e2a4a; --accent-ink:#0f1115; --halo:#0f1115; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --warn-bg:#2a2210; --warn-line:#8a6a1f; --warn-ink:#f1d48a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#161a20; --surface-2:#1d2229; --ink:#e7eaef; --ink-2:#aab1bd; --ink-3:#8a93a3;
  --line:#2a3039; --box:#1a1f26; --box-stroke:#5d6778; --stub:#1f242c; --stub-ink:#8d96a5; --stub-stroke:#323946;
  --accent:#7096ff; --accent-soft:#1e2a4a; --accent-ink:#0f1115; --halo:#0f1115; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --warn-bg:#2a2210; --warn-line:#8a6a1f; --warn-ink:#f1d48a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ---------- layout ---------- */
.app{display:flex;height:100vh;width:100vw}
.term{display:none}
.tool{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.app.split{background:#d9dce1;padding:14px;gap:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app.split{background:#07080a}}
:root[data-theme="dark"] .app.split{background:#07080a}
.app.split .term{display:flex}
.app.split .tool{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.browserbar{display:none;height:40px;align-items:center;gap:10px;padding:0 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.app.split .browserbar{display:flex}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.url{flex:1;max-width:420px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:var(--ink-2);font-family:var(--mono)}

/* top bar */
.top{height:48px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;font-size:15px}
.logo svg{display:block}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);min-width:0}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--ink-2)}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs .here{color:var(--ink);font-weight:600;padding:4px 6px}
.crumbs .sep{color:var(--ink-3)}
.top .spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
.seg button{border:0;background:var(--surface);padding:4px 10px;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.app.split .seg{display:none}

/* header */
.head{padding:14px 28px 6px;display:flex;align-items:center;gap:24px}
.head .t{min-width:0;flex:1}
.head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:baseline;gap:10px}
.head h1 .p{font-family:var(--mono);font-size:14px;font-weight:400;color:var(--ink-3)}
.head .s{margin:6px 0 0;font-size:16.5px;color:var(--ink)}
.status{flex:none;width:360px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.4}
.status .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;color:var(--ink)}
.status .h span{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.status .f{color:var(--ink-2);margin-top:3px}
.status .q{color:var(--warn-ink);margin-top:3px}
.raw-note{flex:none;max-width:420px;font-size:13px;color:var(--warn-ink);border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:8px 12px;line-height:1.4}

/* caption bar */
.caption{display:none;margin:10px 28px 0;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:8px 10px 8px 14px;align-items:center;gap:14px;box-shadow:var(--shadow)}
.caption.on{display:flex}
.caption .what{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.caption .kind{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.caption .q{font-size:15px;font-weight:600;white-space:nowrap}
.caption .tag{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.caption .step{font-size:13.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:1px solid var(--line);padding-left:14px}
.caption .step b{color:var(--accent)}
.caption .step .mono{font-size:12.5px;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--box-stroke)}
a.btn{text-decoration:none;color:var(--ink);font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.icon{padding:6px 9px;font-family:var(--mono)}
.btn.round{width:34px;height:34px;border-radius:50%;padding:0;font-weight:700}

/* stage */
.stage{flex:1;min-height:0;display:flex;position:relative}
.mapcol{flex:1;min-width:0;display:flex;flex-direction:column}
.mapwrap{flex:1;min-height:0;position:relative;padding:6px 20px 4px}
.mapwrap svg{width:100%;height:100%;display:block}
.panel{width:0;overflow:hidden}
.panel.on{width:460px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto}
.strip{display:none}
.strip.on{display:grid;grid-template-columns:230px 1fr 1fr;gap:22px;margin:0 20px 10px;padding:14px 18px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow)}
.strip h2{margin:0;font-family:var(--mono);font-size:20px}
.strip .path{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin:4px 0 12px}
.four{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.four div{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4}
.four div:first-child{border-top:0}
.four dt{color:var(--ink-3);font-size:12.5px;padding-top:1px}
.four dd{margin:0}
.four .mono{font-size:12px;color:var(--ink-2)}
.sec{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.acts{display:flex;flex-direction:column}
.act{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;border:0;background:none;text-align:left;font-size:14px}
.act:hover,.act.hov{background:var(--surface-2)}
.m{font-family:var(--mono);font-size:11px;font-weight:700;width:54px;flex:none;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;text-align:center;padding:2px 0}
.act .lab{white-space:nowrap}
.act .fn{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.act .rt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3);display:none}
.act:hover .rt,.act.hov .rt{display:inline}
.act .go{color:var(--accent);font-size:12.5px;font-weight:600;margin-left:auto;white-space:nowrap}

/* bottom bar */
.bottom{height:54px;display:flex;align-items:center;gap:14px;padding:0 24px;border-top:1px solid var(--line);background:var(--surface)}
.bottom .spacer{flex:1}
.gaps{display:none;font-size:13px;color:var(--ink-2);gap:8px;flex-wrap:nowrap;overflow:hidden}
.gaps.on{display:flex}
.gaps b{color:var(--warn-ink);white-space:nowrap}
.gaps span{white-space:nowrap;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:999px;padding:3px 10px}

/* svg */
svg text{font-family:var(--sans);fill:var(--ink)}
.n rect.b{fill:var(--box);stroke:var(--box-stroke);stroke-width:1.5}
.n.dash rect.b{stroke-dasharray:6 5}
.n .tt{font-size:17px;font-weight:650}
.n .st{font-size:13.5px;fill:var(--ink-2)}
.n .ft{font-size:12.5px;fill:var(--ink-3);font-family:var(--mono)}
.n{cursor:pointer}
.n.open:hover rect.b{stroke:var(--accent);stroke-width:2.2}
.n:hover rect.b{stroke:var(--ink-2)}
.n .hit{fill:transparent}
.n .hov{font-size:12.5px;font-weight:600;fill:var(--accent);opacity:0}
.n.open:hover .hov,.n.open.forcehover .hov{opacity:1}
.n.forcehover rect.b{stroke:var(--accent);stroke-width:2.2}
.n .om circle{fill:var(--surface-2);stroke:var(--box-stroke)}
.n .om path{stroke:var(--ink-2);stroke-width:1.8;fill:none}
.n.open:hover .om circle,.n.forcehover .om circle{fill:var(--accent);stroke:var(--accent)}
.n.open:hover .om path,.n.forcehover .om path{stroke:var(--accent-ink)}
.n.sel rect.b{stroke:var(--accent);stroke-width:2.5}
.n.stub rect.b{fill:var(--stub);stroke:var(--stub-stroke)}
.n.stub .tt{font-size:14px;font-weight:600;fill:var(--stub-ink)}
.n.stub .st{fill:var(--stub-ink);font-size:12.5px}
.actor .head{fill:none;stroke:var(--ink-2);stroke-width:2}
.actor .body{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.chip rect{fill:var(--surface-2);stroke:var(--line)}
.chip text{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
.chip{cursor:pointer}
.chip:hover rect{stroke:var(--accent)}
.chip.lit rect{fill:var(--accent);stroke:var(--accent)}
.chip.lit text{fill:var(--accent-ink);font-weight:700}
.a path.l{fill:none;stroke:var(--ink-3);stroke-width:1.6}
.a .hitp{fill:none;stroke:transparent;stroke-width:14}
.a{cursor:help}
.a:hover path.l{stroke:var(--ink)}
.lbl{font-size:13px;fill:var(--ink-2);paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
.entry{font-size:12.5px;font-weight:800;letter-spacing:1.4px;fill:var(--ink)}
.entry-l{stroke:var(--ink);stroke-width:2.4;fill:none}
.out path{stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-dasharray:none}
.out circle.o{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.out circle.i{fill:var(--ink)}
.out text{font-size:13.5px;font-weight:600}
.colhead{font-size:12.5px;font-weight:800;letter-spacing:1.4px;fill:var(--ink)}
.colrule{stroke:var(--line);stroke-width:1.2}
.note{font-size:12.5px;fill:var(--ink-3)}
.around rect{fill:var(--surface);stroke:var(--box-stroke)}
.around text{font-size:13.5px;font-weight:600}
.around{cursor:pointer}
.around:hover rect{stroke:var(--ink)}
#ah path{fill:var(--ink-3)} #ahl path{fill:var(--accent)} #ahe path{fill:var(--ink)}
/* raw engine output */
.raw rect.b{fill:var(--surface);stroke:var(--box-stroke);stroke-width:1.3}
.raw .tt{font-family:var(--mono);font-size:15px;font-weight:600}
.raw .st{font-size:12.5px;fill:var(--ink-3)}
.raw.grp rect.b{stroke-dasharray:3 3}

/* path / question mode */
.pathmode .dimmable{opacity:.22}
.pathmode .n.lit,.pathmode .a.lit,.pathmode .out.lit{opacity:1}
.pathmode .n.lit.on,.pathmode .n.lit.pass{opacity:.62}
.pathmode .a.lit.on{opacity:.55}
.n.lit rect.b{stroke:var(--accent);stroke-width:1.8;fill:var(--accent-soft)}
.n.lit.cur rect.b{stroke-width:3.5}
.n.lit.pass rect.b{fill:var(--box)}
.n.stub.lit .tt,.n.stub.lit .st{fill:var(--accent);font-weight:700}
.a.lit path.l{stroke:var(--accent);stroke-width:2}
.a.lit.cur path.l{stroke-width:3.4}
.a.lit .lbl{fill:var(--accent);font-weight:600}
.out.lit path{stroke:var(--accent);stroke-width:2.4}
.out.lit circle.o{stroke:var(--accent)} .out.lit circle.i{fill:var(--accent)} .out.lit text{fill:var(--accent)}
.badge circle{fill:var(--accent)}
.badge text{fill:var(--accent-ink);font-size:13px;font-weight:800;text-anchor:middle}
.badge.cur circle{stroke:var(--accent-soft);stroke-width:5}
.callout rect.cb{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.callout .row{cursor:help}
.callout .row:hover rect.rh,.callout .row.forcehover rect.rh{fill:var(--accent-soft)}
.callout rect.rh{fill:transparent}
.callout .fn{font-family:var(--mono);font-size:14.5px;font-weight:600}
.callout .why{font-size:14px;fill:var(--ink-2)}
.callout line{stroke:var(--accent);stroke-width:1.6}

/* drawer */
.drawer .hd{padding:18px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.drawer h3{margin:0;font-size:18px;display:flex;align-items:center}
.drawer h3 .btn{margin-left:auto}
.drawer .sub{font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.45}
.grp{padding:10px 14px 2px}
.grp .gh{font-size:12.5px;color:var(--ink-3);padding:4px 8px 6px;display:flex;gap:8px}
.grp .gh b{color:var(--ink);font-family:var(--mono);font-weight:600}
.cmds{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px 16px}
.cmds span{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface-2)}

/* popovers */
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;font-size:13.5px;line-height:1.45;display:none;max-width:380px}
.pop.on{display:block}
.pop .h{font-weight:700;font-size:14px;margin-bottom:4px}
.pop .mono{font-size:12px;color:var(--ink-3)}
.pop .hint{margin-top:6px;font-size:12.5px;color:var(--accent);font-weight:600}
.pop.around-pop{max-width:none;width:470px;padding:6px 6px}
.around-pop .r{display:grid;grid-template-columns:200px 1fr;column-gap:12px;padding:5px 10px;border-radius:6px;font-size:13px}
.around-pop .r:hover{background:var(--surface-2)}
.around-pop .r b{font-weight:600}
.around-pop .r span{color:var(--ink-2)}
.help{right:24px;bottom:66px;width:330px}
.help .row{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px}
.help .row svg{flex:none}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;display:none;z-index:50;box-shadow:var(--shadow)}
.toast.on{display:block}

/* terminal */
.term{width:440px;flex:none;flex-direction:column;background:var(--term-bg);color:var(--term-ink);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25);font-family:var(--mono);font-size:14px;line-height:1.6}
.term .tb{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#26272b;color:#a9adb5;font-size:12.5px}
.term .tb .dots i{background:#45474d}
.term .body{flex:1;padding:18px 20px;overflow:hidden;display:flex;flex-direction:column}
.term .ln{white-space:pre-wrap}
.term .dim{color:var(--term-dim)}
.term .acc{color:var(--term-acc)}
.term .usr{color:#ffffff;background:#2c2d31;border-radius:4px;padding:2px 6px;margin:10px -6px 4px;display:block}
.term .ok{color:#7fbf7f}
.term .sp{height:10px}
.term .box{margin-top:auto;border:1px solid #4a4c52;border-radius:8px;padding:8px 12px;color:var(--term-dim)}
.term .foot{font-size:12px;color:#6c7079;padding-top:6px}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="term" id="term" aria-label="Terminal Claude Code">
    <div class="tb"><div class="dots"><i></i><i></i><i></i></div><span>claude — ~/clients/full-stack-fastapi-template</span></div>
    <div class="body" id="termBody"></div>
  </section>
  <section class="tool" id="tool">
    <div class="browserbar"><div class="dots"><i></i><i></i><i></i></div><div class="url">127.0.0.1:7420 · Umbra</div></div>
    <div class="top">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="5" width="6" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="12.5" y="5" width="6" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 10h5" stroke="currentColor" stroke-width="1.6"/></svg>Umbra</div>
      <nav class="crumbs" id="crumbs"></nav>
      <div class="spacer"></div>
      <div class="seg" id="segRepo" title="Deux projets d'exemple"></div>
      <div class="seg" id="segVer" title="Ce qui est dessiné : la carte visée, ou ce que le moteur sort aujourd'hui sans IA"></div>
    </div>
    <div class="head" id="head"></div>
    <div class="caption" id="caption"></div>
    <div class="stage">
      <div class="mapcol">
        <div class="mapwrap" id="mapwrap"></div>
        <div class="strip" id="strip"></div>
      </div>
      <aside class="panel" id="panel"></aside>
    </div>
    <div class="bottom">
      <button class="btn" id="actionsBtn"></button>
      <div class="gaps" id="gaps"></div>
      <div class="spacer"></div>
      <button class="btn round" id="helpBtn" aria-label="Aide : comment lire la carte">?</button>
    </div>
  </section>
  <div class="pop" id="tip"></div>
  <div class="pop around-pop" id="aroundPop"></div>
  <div class="pop help" id="helpPop"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
const ROOTS = {
  tpl: "C:/clients/full-stack-fastapi-template/",
  sql: "C:/clients/sqlite-utils/"
};
const vs = (repo, p, l) => "vscode://file/" + ROOTS[repo] + p + (l ? ":" + l : "");

/* ============ data, read in the repos on 2026-10-27 ============ */
const ACTIONS_TPL = [
  { file: "items.py", role: "items", rows: [
    ["GET", "Lister ses items", "/api/v1/items/", "read_items", 14],
    ["GET", "Voir un item", "/api/v1/items/{id}", "read_item", 49],
    ["POST", "Créer un item", "/api/v1/items/", "create_item", 62, "A"],
    ["PUT", "Modifier un item", "/api/v1/items/{id}", "update_item", 76],
    ["DELETE", "Supprimer un item", "/api/v1/items/{id}", "delete_item", 100] ] },

function badge(n, x, y, cur) {

/* o: { lit: "cur" | "on" | "pass", badge, litChip, sel, force } */
function node(id, n, o) {
  const kind = n.kind || "box";
  const cls = ["n", "dimmable", kind];
  if (n.open) cls.push("open");
  if (n.dash) cls.push("dash");
  if (o.lit) cls.push("lit", o.lit);
  if (o.sel) cls.push("sel");
  if (o.force) cls.push("forcehover");
  const cx = n.x + n.w / 2;
  let g = `<g class="${cls.join(" ")}" data-id="${id}">`;
  if (kind === "actor") {
    g += `<rect class="hit" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"/>`;
    g += `<circle class="head" cx="${cx}" cy="${n.y + 18}" r="12"/><path class="body" d="M${cx - 22},${n.y + 60} C${cx - 22},${n.y + 36} ${cx + 22},${n.y + 36} ${cx + 22},${n.y + 60}"/>`;
    g += `<text class="tt" x="${cx}" y="${n.y + 86}" text-anchor="middle">${esc(n.t)}</text>`;
    g += `<text class="st" x="${cx}" y="${n.y + 106}" text-anchor="middle">${esc(n.s)}</text>`;
    return g + `</g>`;
  }
  g += `<rect class="b" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10"/>`;
  if (kind === "stub") {
    const lines = n.s2 || [];
    const y0 = n.y + n.h / 2 - (lines.length) * 10 + 5;
    g += `<text class="tt" x="${cx}" y="${y0}" text-anchor="middle">${esc(n.t)}</text>`;
    lines.forEach((l, i) => { g += `<text class="st" x="${cx}" y="${y0 + 20 * (i + 1)}" text-anchor="middle">${esc(l)}</text>`; });
  } else if (kind === "chips") {
    g += `<text class="tt" x="${cx}" y="${n.y + 32}" text-anchor="middle">${esc(n.t)}</text>`;
    g += `<text class="ft" x="${cx}" y="${n.y + 54}" text-anchor="middle">${esc(n.f)}</text>`;
    [n.chips.slice(0, 3), n.chips.slice(3)].forEach((r, ri) => {
      const ws = r.map(c => (c.length + 3) * 7.5 + 14);
      const tot = ws.reduce((a, b) => a + b, 0) + (r.length - 1) * 8;
      let x = cx - tot / 2;
      r.forEach((c, i) => {
        const lit = o.litChip === c;
        g += `<g class="chip${lit ? " lit" : ""}" data-chip="${c}"><rect x="${x}" y="${n.y + 70 + ri * 38}" width="${ws[i]}" height="28" rx="6"/><text x="${x + ws[i] / 2}" y="${n.y + 88.5 + ri * 38}" text-anchor="middle">${c}.py</text></g>`;
        x += ws[i] + 8;
      });
    });
  } else {
    const hasS = !!n.s;
    const ty = n.h <= 100 ? n.y + (hasS ? 32 : 40) : n.y + 42;
    g += `<text class="tt" x="${cx}" y="${ty}" text-anchor="middle">${esc(n.t)}</text>`;
    let y = ty;
    if (hasS) { y += 23; g += `<text class="st" x="${cx}" y="${y}" text-anchor="middle">${esc(n.s)}</text>`; }
    if (n.f) { y += hasS ? 22 : 26; g += `<text class="ft" x="${cx}" y="${y}" text-anchor="middle">${esc(n.f)}</text>`; }
    if (n.f2) { y += 19; g += `<text class="ft" x="${cx}" y="${y}" text-anchor="middle">${esc(n.f2)}</text>`; }
  }
  if (n.open) {
    const mx = n.x + n.w - 16, my = n.y + 16;
    g += `<g class="om"><circle cx="${mx}" cy="${my}" r="9"/><path d="M${mx - 2},${my - 4} L${mx + 2},${my} L${mx - 2},${my + 4}"/></g>`;
    g += `<text class="hov" x="${n.x + n.w}" y="${n.y - 9}" text-anchor="end">voir dedans →</text>`;
  }
  if (o.badge) g += badge(o.badge, n.x + 2, n.y + 2, o.lit === "cur");
  return g + `</g>`;
}
function arrow(a, lit) {

function callout(x, y, w, rows, connector) {

  if (S.autour) placeAround();
  hideTip();
  bindMap();
  if (S.force) requestAnimationFrame(forceTip);
}
function go(patch) { Object.assign(S, patch); render(); }
function levelData() { return S.view === "L0" ? REPOS[S.repo].L0 : (S.view === "web" ? L1_WEB : L1_API); }

function bindMap() {
  const svg = document.querySelector("#mapwrap svg");
  const L = levelData();
  svg.querySelectorAll(".n[data-id]").forEach(el => {
    const id = el.dataset.id;
    const data = L.nodes[id];
    el.addEventListener("mouseenter", e => { if (data.tip) showTip(e, data.tip, !!data.open); });
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", () => {
      if (data.back) { go({ view: "L0", card: false, path: null, sel: data.back }); return; }
      if (data.open === "api" || data.open === "web") { go({ view: data.open, sel: null, path: null, card: false }); return; }
      if (data.open === "none") { toast("L'intérieur de cette boîte n'est pas encore dessiné."); return; }
      if (id === "routes") return;
      go({ sel: S.sel === id ? null : id });
    });
  });
  svg.querySelectorAll(".chip").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    if (el.dataset.chip === "items") go({ card: true, path: null });
    else toast("Seule items.py a sa carte ici.");
  }));
  svg.querySelectorAll(".a[data-arrow]").forEach(el => {
    const a = L.arrows.find(x => x.id === el.dataset.arrow);
    if (!a || !a.info) return;
    el.addEventListener("mouseenter", e => showTip(e, [a.info[0], a.info[1], a.info[2] || ""]));
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);
  });
  svg.querySelectorAll(".callout .row").forEach(el => {
    el.addEventListener("mouseenter", e => showTip(e, ["Pourquoi ici", el.dataset.why, el.dataset.file]));
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);
  });
  const ar = svg.querySelector("#aroundChip");
  if (ar) {
    ar.addEventListener("mouseenter", () => { S.autour = ar.dataset.list; document.getElementById("aroundPop").classList.add("on"); placeAround(); });
    ar.addEventListener("mouseleave", () => { setTimeout(() => { if (!aroundHover) { S.autour = false; document.getElementById("aroundPop").classList.remove("on"); } }, 120); });
  }
}
let aroundHover = false;
function placeAround() {
  const pop = document.getElementById("aroundPop");
  const list = AROUND[typeof S.autour === "string" ? S.autour : levelData().around.list];
  pop.innerHTML = `<div style="padding:6px 10px 8px;font-size:12.5px;color:var(--ink-3)">Autour du projet : ne fait pas tourner l'appli</div>` +
    list.map(r => `<div class="r" title="${esc(r[2])}"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("");
  const chip = document.querySelector("#aroundChip rect");
  if (!chip) return;
  const r = chip.getBoundingClientRect();
  const appR = document.getElementById("app").getBoundingClientRect();
  pop.style.top = "0px";
  if (S.view === "L0") {
    pop.style.left = (r.left - appR.left) + "px";
    pop.style.top = Math.max(8, r.top - pop.offsetHeight - 8 - appR.top) + "px";
  } else {
    pop.style.left = (r.right + 12 - appR.left) + "px";
    pop.style.top = Math.max(8, r.bottom - pop.offsetHeight - appR.top) + "px";
  }
}
document.getElementById("aroundPop").addEventListener("mouseenter", () => { aroundHover = true; });
document.getElementById("aroundPop").addEventListener("mouseleave", () => { aroundHover = false; S.autour = false; document.getElementById("aroundPop").classList.remove("on"); });

const tip = document.getElementById("tip");
function showTip(e, t, open) {
  tip.innerHTML = `<div class="h">${esc(t[0])}</div><div>${esc(t[1])}</div>${t[2] ? `<div class="mono">${esc(t[2])}</div>` : ""}` +
    (open ? `<div class="hint">clic : voir dedans →</div>` : "");
  tip.classList.add("on"); moveTip(e);
}
function moveTip(e) {
  const appR = document.getElementById("app").getBoundingClientRect();
  let x = e.clientX - appR.left + 16, y = e.clientY - appR.top + 16;
  if (x + 390 > appR.width) x = e.clientX - appR.left - 390;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.classList.remove("on"); }
/* For screenshots: show the hover state of one element without a mouse. */
function forceTip() {
  let el, t, open = false;
  if (S.force.startsWith("why")) {
    el = document.querySelector(`.callout .row[data-n="${S.force.slice(3)}"]`);
    if (!el) return;
    t = ["Pourquoi ici", el.dataset.why, el.dataset.file];
  } else {
    el = document.querySelector(`.n[data-id="${S.force}"]`);
    const d = levelData().nodes[S.force];
    if (!el || !d) return;
    t = d.tip; open = !!d.open;
  }
  const r = el.getBoundingClientRect();
  const below = S.force.startsWith("why") ? r.bottom + 40 : r.bottom - 8;
  showTip({ clientX: r.left + r.width * 0.55, clientY: below }, t, open);
}

let toastT;
function toast(msg, sticky) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); if (!sticky) toastT = setTimeout(() => t.classList.remove("on"), 2600);
}
function copyFiles() {
  const isA = S.path === "A";
  const title = isA ? "Chemin : Créer un item (POST /api/v1/items/)" : "Tâche : " + PATH_B.q;
  const files = isA ? PATH_A.files : PATH_B.files;
  const text = title + "\nFichiers (" + files.length + ") :\n" + files.map(f => "- " + f).join("\n");
  try { navigator.clipboard.writeText(text).catch(() => {}); } catch (e) { /* clipboard blocked: still confirm */ }
  toast("Copié");
}

document.getElementById("actionsBtn").onclick = () => go({ panel: S.panel === "actions" ? null : "actions" });
document.getElementById("helpBtn").onclick = () => go({ help: !S.help });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (S.help) go({ help: false });
    else if (S.panel) go({ panel: null });
    else if (S.path) go({ path: null });
    else if (S.card) go({ card: false });
    else if (S.view !== "L0") go({ view: "L0", sel: S.view });
  }
  if (S.path === "A" && e.key === "ArrowRight") go({ step: Math.min(5, S.step + 1) });
  if (S.path === "A" && e.key === "ArrowLeft") go({ step: Math.max(1, S.step - 1) });
});
window.addEventListener("resize", () => { if (S.autour) placeAround(); });

const HASH = {
  carte: {}, autour: { autour: "tpl" }, actions: { panel: "actions", hoverAct: "Créer un item" },
  survol: { force: "api" }, aide: { help: true },
  moteur: { ver: "raw" },
  sqlite: { repo: "sql" }, "sqlite-moteur": { repo: "sql", ver: "raw" },
  serveur: { view: "api" }, web: { view: "web" },
  items: { view: "api", card: true, hoverAct: "Créer un item" },
  chemin: { view: "api", path: "A", step: 3 }, "chemin-fin": { view: "api", path: "A", step: 5 },
  lancement: { split: "launch" }, question: { split: "question", path: "B" },
  pourquoi: { split: "question", path: "B", force: "why4" },
  copie: { split: "copy", path: "B" }
};
function fromHash() {
  const h = location.hash.replace("#", "");
  Object.assign(S, FRESH, HASH[h] || {});
  render();
  if (h === "copie") toast("Copié", true);
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
