# Umbra rules added on top of the gitleaks defaults (same schema).
# gitleaks skips plain password assignments and credentials in URLs to limit noise in CI;
# Umbra must never store or send them, so it is stricter.
# Values that are clearly names (letters only and containing the key word, e.g. "PasswordInput"),
# URLs without credentials and slash paths are allowed, so code and endpoints stay readable.

[[rules]]
id = "umbra-password-assignment"
description = "Password, secret or token assigned to a quoted literal (also JSON-escaped quotes)"
regex = '''(?i)(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|token)[\w.\-]{0,20}\\?["']?\s*(?:[:=]|:=|=>)\s*\\?["']([^"'\s\\]{8,})\\?["']'''
entropy = 3.0
keywords = ["password", "passwd", "pwd", "secret", "key", "token"]

[[rules.allowlists]]
regexes = [
    '''^\$\{.*\}$''',
    '''^\{\{.*\}\}$''',
    '''^<.*>$''',
    '''^%\(?\w+\)?s?$''',
    '''(?i)^(?:changeme|changethis|change_me|example|placeholder|password|secret|dummy|xxx+|\*+)$''',
    '''(?i)^your[_\-]''',
    '''(?i)^[a-z_\-]*(?:password|passwd|secret|token|key)[a-z_\-]*$''',
    '''(?i)^[a-z][a-z0-9+.\-]*://[^:@\s]+$''',
    '''^/?[a-z0-9_.\-]+(?:/[a-z0-9_.\-]+)+/?$''',
]

[[rules]]
id = "umbra-url-credentials"
description = "Password embedded in a URL (user:password@host)"
regex = '''(?i)\b[a-z][a-z0-9+.\-]*://[^\s:/@"']+:([^\s@/"']+)@'''
keywords = ["://"]

[[rules.allowlists]]
regexes = [
    '''^\$\{.*\}$''',
    '''^\{\{.*\}\}$''',
    '''^<.*>$''',
    '''^\$\w+$''',
    '''(?i)^(?:password|pass|secret|changeme|xxx+|\*+)$''',
]

[[rules]]
id = "umbra-config-assignment"
description = "Unquoted password, secret or token value in a configuration file or Dockerfile"
regex = '''(?im)^[ \t\-]*(?:(?:ENV|ARG|export|set)[ \t]+)?[\w.\-]*(?:password|passwd|secret|token|api[_\-]?key|access[_\-]?key)[\w.\-]*[ \t]*[:=][ \t]*([^\s"'#(){}\[\],;]{8,})[ \t]*$'''
path = '''(?i)(?:\.(?:ya?ml|ini|cfg|conf|properties|toml|env\w*)$|(?:^|/)(?:Dockerfile[^/]*|\.env[^/]*)$)'''
entropy = 3.0
keywords = ["password", "passwd", "secret", "token", "key"]

[[rules.allowlists]]
regexes = [
    '''^\$\{.*\}$''',
    '''^\$\w+$''',
    '''^\{\{.*\}\}$''',
    '''^<.*>$''',
    '''(?i)^(?:changeme|changethis|change_me|example|placeholder|xxx+|\*+)$''',
    '''(?i)^[a-z_\-]*(?:password|passwd|secret|token|key)[a-z_\-]*$''',
    '''(?i)^[a-z][a-z0-9+.\-]*://[^:@\s]+$''',
    '''^/?[a-z0-9_.\-]+(?:/[a-z0-9_.\-]+)+/?$''',
]

[[rules]]
id = "umbra-template-sensitive-value"
description = "Any value of a sensitive key in a template file (.env.example, *.sample, ...)"
regex = '''(?im)^[ \t\-]*(?:export[ \t]+)?[\w.\-]*(?:password|passwd|pwd|secret|token|api[_\-]?key|access[_\-]?key|private[_\-]?key|credential|auth)[\w.\-]*["']?[ \t]*[:=][ \t]*["']?([^\s"'#]+)'''
path = '''(?i)\.(?:example|sample|template|dist|tpl)$'''
keywords = ["password", "passwd", "pwd", "secret", "token", "key", "credential", "auth"]

[[rules.allowlists]]
regexes = [
    '''^\$\{.*\}$''',
    '''^\$\w+$''',
    '''^\{\{.*\}\}$''',
    '''^<.*>$''',
    '''(?i)^(?:changeme|changethis|change_me|example|placeholder|your[_\-].*|xxx+|\*+|true|false|none|null)$''',
]
