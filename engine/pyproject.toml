[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-engine"
version = "0.1.0"
description = "Umbra System Explorer engine: local daemon, Project registry and claim store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "google-re2>=1.1.20250722,<2.0",
    "pathspec>=0.12,<2.0",
    "tree-sitter>=0.25,<1.0",
    "PyYAML>=6.0,<7.0",
    "tree-sitter-language-pack>=1.22,<2.0",
    "watchfiles>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "pyright>=1.1.400,<1.2",
]

[project.scripts]
umbra-engine = "umbra_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"umbra_engine.guard" = ["gitleaks.toml", "umbra.toml", "GITLEAKS-LICENSE"]
"umbra_engine" = ["web/**/*"]  # the built web app (`npm run build` in ui/)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]  # verbatim copies of a real project: their line numbers are cited

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
